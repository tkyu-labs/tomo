# Builds Tomo for macOS (arm64) and Windows (x64) when a version tag is pushed (v0.1.1, …) and uploads the installers
# and the update feeds (latest-mac.yml, latest.yml) to a draft GitHub Release. Publishing that draft makes the update
# visible to installed apps. The tag must match "version" in package.json.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: tkyu-labs/tomo-packs
          path: tomo-packs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run typecheck && npm run lint
      - name: uv and school packs
        shell: bash
        run: |
          node scripts/fetch-uv.mjs ${{ matrix.target == 'win' && 'win32-x64' || '' }}
          node scripts/prepare-packs.mjs
      - name: Build and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_VITE_GAKUEN_URL: ${{ secrets.GAKUEN_URL }}
          # macOS signing + notarisation (skipped, unsigned build, when the secrets are not set)
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx electron-vite build
          if [ "${{ matrix.target }}" = mac ] && [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-builder --${{ matrix.target }} --publish always
