# Tomo app packaging. Local builds are unsigned (`npm run dist:mac` / `npm run dist:win`). Releases are built by
# .github/workflows/release.yml on a version tag; macOS signing and notarisation come from repository secrets there
# (BUILDING.md § Releases). Updates: electron-updater reads the `publish` feed (GitHub Releases of this repository).
appId: io.github.tkyu-labs.tomo
productName: Tomo
copyright: Copyright (c) 2026 Tomo contributors
directories:
  output: release
  buildResources: build-resources
files:
  - out/**
  - package.json
extraResources:
  # the AI engine is not shipped: Tomo installs Hermes from GitHub on first start with this uv
  - from: build/uv
    to: uv
  - from: plugins
    to: plugins
    filter: ['**/*', '!tests/**', '!**/__pycache__/**']
  - from: build/packs
    to: packs
  - from: build-resources/icon.png
    to: icon.png
  - from: engine-helpers
    to: engine-helpers
    filter: ['*.py']
asarUnpack: []
publish:
  provider: github
  owner: tkyu-labs
  repo: tomo
  releaseType: draft   # the workflow uploads to a draft; publishing the release is what ships the update
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip      # macOS auto-update downloads the zip
      arch: [arm64]
  category: public.app-category.education
  hardenedRuntime: true
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: Tomo-Setup-${version}.${ext}   # same name locally and on GitHub (latest.yml points at it)
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
